<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Cadastro</title>
<!-- Bootstrap CSS & Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- CSS Customizado -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

<div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="mb-4">Editar cadastro</h2>
          
          <form id="edit-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nome do produto</label>
                <input class="form-control" id="name" name="name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Marca</label>
                <input class="form-control" id="brand" name="brand" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Categoria</label>
                <select class="form-select" id="category" name="category" required>
                  <option value="">Selecione uma categoria</option>
                  <option value="Alimentos">Alimentos</option>
                  <option value="Bebidas">Bebidas</option>
                  <option value="Higiene">Higiene</option>
                  <option value="Laticínios">Laticínios</option>
                  <option value="Limpeza">Limpeza</option>
                  <option value="Padaria">Padaria</option>
                  <option value="Snacks">Snacks</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Mercado</label>
                <input class="form-control" id="market_name" name="market_name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Endereço</label>
                <input class="form-control" id="address" name="address" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Cidade</label>
                <input class="form-control" id="city" name="city" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Preço</label>
                <input class="form-control" type="number" step="0.01" id="price" name="price" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Imagem (URL)</label>
                <input class="form-control" id="image_url" name="image_url" />
              </div>
            </div>
            <button class="btn btn-success mt-4" type="submit">Atualizar</button>
            <button class="btn btn-secondary mt-4 ms-2" type="reset">Cancelar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    // Obtém o ID a partir do caminho da URL (ex: /meus-cadastros/123/editar)
    const pathParts = window.location.pathname.split('/');
    const cadastroId = pathParts[2];
    const form = document.getElementById('edit-form');

    if (!cadastroId) return;

    // 1. Carrega os dados do cadastro via API
    try {
      const response = await fetch(`/api/meus-cadastros/${cadastroId}`);
      if (!response.ok) throw new Error('Falha ao obter dados do cadastro');
      
      const data = await response.json();

      document.getElementById('name').value = data.product?.name || data.nome || '';
      document.getElementById('brand').value = data.product?.brand || data.marca || '';
      document.getElementById('category').value = data.product?.category || data.categoria || '';
      document.getElementById('market_name').value = data.price?.market || data.market?.name || data.mercado || '';
      document.getElementById('address').value = data.price?.address || data.market?.address || data.endereco || '';
      document.getElementById('city').value = data.price?.city || data.market?.city || data.cidade || '';
      document.getElementById('price').value = data.price?.price || data.preco || '';
      document.getElementById('image_url').value = data.product?.image_url || data.image_url || '';

    } catch (error) {
      console.error('Erro ao carregar os dados para edição:', error);
      alert('Não foi possível carregar os dados deste cadastro.');
    }

    // 2. Envia as atualizações para a API
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      try {
          const response = await fetch(`/api/meus-cadastros/${cadastroId}`, {
            method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          window.location.href = '/meus-cadastros';
        } else {
          alert('Erro ao atualizar cadastro.');
        }
      } catch (error) {
        console.error('Erro ao salvar alterações:', error);
      }
    });
  });
</script>
</body>
</html>

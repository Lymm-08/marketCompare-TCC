<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta - MarketCompare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/main.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="mb-4">Criar conta</h2>
          
          <form id="register-form">
            <div class="mb-3">
              <label class="form-label" for="name">Nome</label>
              <input class="form-control" id="name" name="name" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="email">E-mail</label>
              <input class="form-control" type="email" id="email" name="email" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Senha</label>
              <input class="form-control" type="password" id="password" name="password" required />
            </div>
            <div class="mb-3">
              <label class="form-label" for="confirm_password">Confirmar senha</label>
              <input class="form-control" type="password" id="confirm_password" name="confirm_password" required />
            </div>
            <button class="btn btn-success w-100" type="submit">Criar conta</button>
          </form>

          <div class="mt-3 text-center">
            <a href="/login">Já possui uma conta? Faça login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('register-form');

    if (!form) return;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;

      if (password !== confirmPassword) {
        alert('As senhas não coincidem!');
        return;
      }

      try {
        const response = await fetch('/api/cadastro', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, password })
        });

        if (response.ok) {
          localStorage.setItem('marketcompare-authenticated', 'true');
          alert('Conta criada com sucesso!');
          window.location.href = '/';
        } else {
          const errorData = await response.json().catch(() => ({}));
          alert(errorData.message || 'Erro ao criar conta.');
        }
      } catch (error) {
        console.error('Erro no cadastro:', error);
        alert('Erro ao conectar com o servidor.');
      }
    });
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Favoritos</title>
  <!-- Bootstrap CSS & Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- CSS Customizado -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

<div class="container my-4">
  <div class="row g-4">
    <div class="col-12">
      <h2 class="mb-4">Favoritos</h2>
    </div>

    <!-- Container onde os favoritos serão renderizados pelo JS -->
    <div id="favorites-list" class="row g-4 col-12"></div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  // Script específico para a tela de favoritos
  document.addEventListener('DOMContentLoaded', async () => {
    const favoritesContainer = document.getElementById('favorites-list');
    if (!favoritesContainer) return;

    try {
      const [favoritesResponse, productsResponse] = await Promise.all([
        fetch('/api/favoritos'),
        fetch('/api/produtos')
      ]);
      const favoriteIds = await favoritesResponse.json();
      const productsData = await productsResponse.json();
      const products = productsData.products || [];
      const favorites = favoriteIds
        .map((favorite) => products.find((product) => String(product.id) === String(favorite.id)))
        .filter(Boolean);

      if (!favorites || favorites.length === 0) {
        favoritesContainer.innerHTML = `
          <div class="col-12">
            <div class="alert alert-info">Você ainda não possui favoritos.</div>
          </div>
        `;
        return;
      }

      favoritesContainer.innerHTML = favorites.map(item => `
        <div class="col-md-6 col-xl-4">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">${item.name || 'Produto'} - ${item.brand || ''}</h5>
              <p class="text-muted">${item.category || 'Geral'}</p>
              <a href="/comparar/${item.id}" class="btn btn-primary">Abrir comparação</a>
              <button class="btn btn-outline-danger mt-2 btn-remover" data-id="${item.id}">Remover</button>
            </div>
          </div>
        </div>
      `).join('');

      // Evento para remover favorito via API
      document.querySelectorAll('.btn-remover').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const productId = e.target.dataset.id;
          try {
            await fetch(`/api/remover-favorito/${productId}`, { method: 'POST' });
            window.location.reload();
          } catch (err) {
            console.error('Erro ao remover favorito:', err);
          }
        });
      });

    } catch (error) {
      console.error('Erro ao carregar favoritos:', error);
      favoritesContainer.innerHTML = `
        <div class="col-12">
          <div class="alert alert-danger">Erro ao carregar lista de favoritos.</div>
        </div>
      `;
    }
  });
</script>
</body>
</html>

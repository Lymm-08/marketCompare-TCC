<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adicionar Produto</title>
 <!-- Bootstrap CSS & Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- CSS Customizado -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

<div class="container my-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="mb-4">Adicionar produto</h2>
          
          <form id="add-product-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label" for="name">Nome do produto</label>
                <input class="form-control" id="name" name="name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="brand">Marca</label>
                <input class="form-control" id="brand" name="brand" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="category">Categoria</label>
                <select class="form-select" id="category" name="category" required>
                  <option value="">Selecione uma categoria</option>
                  <option value="Alimentos">Alimentos</option>
                  <option value="Bebidas">Bebidas</option>
                  <option value="Higiene">Higiene</option>
                  <option value="Laticínios">Laticínios</option>
                  <option value="Limpeza">Limpeza</option>
                  <option value="Padaria">Padaria</option>
                  <option value="Snacks">Snacks</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label" for="market_name">Mercado</label>
                <input class="form-control" id="market_name" name="market_name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="address">Endereço</label>
                <input class="form-control" id="address" name="address" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="city">Cidade</label>
                <input class="form-control" id="city" name="city" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="price">Preço</label>
                <input class="form-control" type="number" step="0.01" id="price" name="price" required />
              </div>
              <div class="col-md-6">
                <label class="form-label" for="image_url">Imagem (URL)</label>
                <input class="form-control" id="image_url" name="image_url" />
              </div>
            </div>
            
            <div class="mt-4 d-flex gap-2">
              <button class="btn btn-success" type="submit">Salvar</button>
              <button class="btn btn-secondary" type="reset">Cancelar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('add-product-form');

    if (!form) return;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const payload = Object.fromEntries(formData.entries());

      try {
        const response = await fetch('/api/produtos', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          window.location.href = '/meus-cadastros';
        } else {
          const errorData = await response.json().catch(() => ({}));
          alert(errorData.message || 'Erro ao cadastrar produto.');
        }
      } catch (error) {
        console.error('Erro no envio do formulário:', error);
        alert('Ocorreu um erro ao conectar com o servidor.');
      }
    });
  });
</script>
</body>
</html>

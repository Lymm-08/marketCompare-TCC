<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarketCompare</title>
<!-- Bootstrap CSS & Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- CSS Customizado -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/main.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="sidebar-brand" href="/">
          <span class="brand-badge">🛒</span>
          <span class="brand-text">MarketCompare</span>
        </a>
        
        <ul class="sidebar-nav" id="sidebar-nav">
          <li><a class="nav-link" href="/">Início</a></li>
          <!-- Links dinâmicos de autenticação inseridos via JS -->
          <li class="nav-item-auth"><a class="nav-link" href="/login">Entrar</a></li>
          <li class="nav-item-auth"><a class="nav-link" href="/register">Criar conta</a></li>
        </ul>

        <div class="sidebar-config">
          <div class="sidebar-config__label">Configuração</div>
          <div class="theme-switch" role="group" aria-label="Configurações do site">
            <button class="theme-switch__option is-active" type="button" data-theme="light" aria-pressed="true">Claro</button>
            <button class="theme-switch__option" type="button" data-theme="dark" aria-pressed="false">Escuro</button>
          </div>
        </div>
      </aside>

      <div class="content-area">
        <header class="topbar">
          <div class="topbar-left">
            <button class="sidebar-toggle" id="sidebarToggle" type="button" aria-label="Abrir menu">☰</button>
            <span class="topbar-brand">MarketCompare</span>
          </div>
          <div class="topbar-actions" id="topbar-actions">
            <a class="btn btn-outline-primary" href="/login">Entrar</a>
          </div>
        </header>

        <main class="container py-4" id="main-content">
          <!-- O conteúdo específico de cada página é inserido aqui -->
        </main>
      </div>
    </div>

    <a class="floating-add-btn" href="/adicionar-produto" title="Adicionar Produto">＋</a>

    <!-- Container de Mensagens / Notificações -->
    <div id="flash-container" class="flash-container" aria-live="polite" aria-atomic="true"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
      // Verifica o estado de autenticação do usuário e atualiza os menus do layout
      document.addEventListener('DOMContentLoaded', async () => {
        const sidebarNav = document.getElementById('sidebar-nav');
        const topbarActions = document.getElementById('topbar-actions');

        try {
          const res = await fetch('/api/me');
          const data = await res.json();

          if (data && data.authenticated) {
            // Layout para Usuário Autenticado
            if (sidebarNav) {
              sidebarNav.innerHTML = `
                <li><a class="nav-link" href="/">Início</a></li>
                <li><a class="nav-link" href="/favoritos">Favoritos</a></li>
                <li><a class="nav-link" href="/meus-cadastros">Itens Cadastrados</a></li>
                <li><a class="nav-link" href="/logout" id="btn-logout-sidebar">Sair</a></li>
              `;
            }
            if (topbarActions) {
              topbarActions.innerHTML = `<a class="btn btn-outline-primary" href="/logout" id="btn-logout-topbar">Sair</a>`;
            }
          } else {
            // Layout para Visitante
            if (sidebarNav) {
              sidebarNav.innerHTML = `
                <li><a class="nav-link" href="/">Início</a></li>
                <li><a class="nav-link" href="/login">Entrar</a></li>
                <li><a class="nav-link" href="/register">Criar conta</a></li>
              `;
            }
            if (topbarActions) {
              topbarActions.innerHTML = `<a class="btn btn-outline-primary" href="/login">Entrar</a>`;
            }
          }
        } catch (err) {
          console.error('Erro ao verificar autenticação:', err);
        }
      });
    </script>
  </body>
</html>

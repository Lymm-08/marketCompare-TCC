<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meus Cadastros</title>
  <!-- Bootstrap CSS & Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- CSS Customizado -->
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>

<div class="container my-4">
  <div class="row g-4">
    <div class="col-12 d-flex justify-content-between align-items-center">
      <h2 class="mb-0">Meus cadastros</h2>
      <a href="/adicionar-produto" class="btn btn-primary">+ Novo Produto</a>
    </div>

    <!-- Container onde os cadastros serão inseridos via JavaScript -->
    <div id="cadastros-list" class="row g-4 col-12 ms-0"></div>
  </div>
</div>

<script src="/static/js/app.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const container = document.getElementById('cadastros-list');
    if (!container) return;

    // 1. Busca os cadastros do usuário
    const loadCadastros = async () => {
      try {
        const response = await fetch('/api/meus-cadastros');
        if (!response.ok) throw new Error('Erro ao carregar cadastros');

        const cadastros = await response.json();

        if (!cadastros || cadastros.length === 0) {
          container.innerHTML = `
            <div class="col-12 px-0">
              <div class="alert alert-info">Você ainda não cadastrou nenhum produto.</div>
            </div>
          `;
          return;
        }

        container.innerHTML = cadastros.map(item => {
          const productName = item.product?.name || item.nome || 'Produto sem nome';
          const productBrand = item.product?.brand || item.marca || '';
          const marketName = item.price?.market || item.market?.name || item.mercado || 'Mercado';
          const marketCity = item.price?.city || item.market?.city || item.cidade || '';
          const priceVal = Number(item.price?.price || item.preco || 0).toFixed(2);
          const cadastroId = item.id;

          return `
            <div class="col-md-6 px-2 mb-3">
              <div class="card h-100 shadow-sm">
                <div class="card-body">
                  <h5 class="card-title">${productName} ${productBrand ? '- ' + productBrand : ''}</h5>
                  <p class="text-muted">${marketName} ${marketCity ? '· ' + marketCity : ''}</p>
                  <p class="fw-bold text-success">R$ ${priceVal}</p>
                  <div class="d-flex gap-2">
                    <a class="btn btn-outline-primary" href="/meus-cadastros/${cadastroId}/editar">Editar</a>
                    <button class="btn btn-outline-danger btn-excluir" data-id="${cadastroId}">Excluir</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        // 2. Adiciona o evento de exclusão
        document.querySelectorAll('.btn-excluir').forEach(button => {
          button.addEventListener('click', async (e) => {
            const id = e.target.dataset.id;
            if (!confirm('Tem certeza de que deseja excluir este cadastro?')) return;

            try {
              const res = await fetch(`/api/meus-cadastros/${id}`, { method: 'DELETE' });
              if (res.ok) {
                loadCadastros(); // Recarrega a lista sem atualizar a página
              } else {
                alert('Erro ao excluir o cadastro.');
              }
            } catch (err) {
              console.error('Erro ao excluir:', err);
            }
          });
        });

      } catch (error) {
        console.error('Erro ao buscar cadastros:', error);
        container.innerHTML = `
          <div class="col-12 px-0">
            <div class="alert alert-danger">Erro ao carregar seus cadastros. Tente novamente mais tarde.</div>
          </div>
        `;
      }
    };

    loadCadastros();
  });
</script>
</body>
</html>
